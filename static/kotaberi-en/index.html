<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kotaberi</title>
<meta name="description" content="Gather around a kotatsu, chat, play games, and travel together, kotatsu and all. Kotaberi is a small 3D room you can join from your browser.">
<link rel="canonical" href="https://civildot.dev/en/kotaberi/">
<link rel="alternate" hreflang="ja" href="https://civildot.dev/kotaberi/">
<link rel="alternate" hreflang="en" href="https://civildot.dev/en/kotaberi/">
<link rel="alternate" hreflang="x-default" href="https://civildot.dev/kotaberi/">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  /* 夜の和室だけの1つの見た目（暗い面だけで作る）。色はゲームの見た目の方針と同じ */
  :root {
    color-scheme: dark;
    --night: #1b2140; --night2: #141933; --deep: #0e1226; --line: #2e3560;
    --paper: #f4efe2; --paper2: #e9e1cc; --ink: #26242e; --sub: #b9bfdc;
    --shu: #d9482b; --andon: #ffb866; --futon: #2f7f80; --futon2: #3f9a98; --mikan: #f08a24; --wood: #6b4636;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 64px; }
  body { margin: 0; background: var(--night2); color: var(--paper); font-family: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', 'Yu Gothic UI', sans-serif; font-weight: 500; line-height: 1.8; font-size: 16px; }
  a { color: var(--andon); }
  img { max-width: 100%; display: block; }
  .min { font-family: 'Shippori Mincho', serif; font-weight: 800; }
  .wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .wrap > * { min-width: 0; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--deep); }

  /* 上の帯（目次） */
  nav.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: rgba(14, 18, 38, .92); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
  /* 上の帯: ロゴと言語の切りかえは動かさず、間の目次だけを横にスクロール（携帯の縦画面でも切りかえが見える） */
  nav.top .wrap { display: flex; align-items: center; gap: 8px; height: 54px; }
  nav.top .navlinks { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 10px; overflow-x: auto; scrollbar-width: none; height: 100%; }
  nav.top .navlinks::-webkit-scrollbar { display: none; }
  nav.top .navlinks > *, nav.top .logo, nav.top .langsw { flex-shrink: 0; }  /* 項目は縮めない（携帯の縦画面で文字が重なった） */
  nav.top .logo { font-weight: 900; color: var(--andon); text-decoration: none; font-size: 19px; white-space: nowrap; margin-right: 6px; }
  nav.top a.n { color: var(--sub); text-decoration: none; font-size: 14px; white-space: nowrap; padding: 4px 10px; border-radius: 99px; }
  nav.top a.n:hover { color: var(--paper); background: var(--line); }

  /* いちばん上 */
  header.hero { position: relative; min-height: min(78vh, 720px); display: flex; align-items: flex-end; background: var(--deep); overflow: hidden; }
  header.hero video, .clip video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  header.hero img.kb { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; object-fit: cover; object-position: center 70%; animation: kb 26s ease-in-out infinite alternate; }
  @keyframes kb { from { transform: scale(1.02); } to { transform: scale(1.12) translate(-1.5%, 1%); } }
  @media (prefers-reduced-motion: reduce) { header.hero img.kb { animation: none; } }
  header.hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(14,18,38,.0) 30%, rgba(14,18,38,.55) 70%, var(--night2) 100%); }
  header.hero .wrap { position: relative; z-index: 1; padding-bottom: 56px; width: 100%; }
  .badge { display: inline-block; background: var(--shu); color: var(--paper); font-weight: 900; font-size: 13px; padding: 2px 12px; border-radius: 99px; letter-spacing: .05em; }
  .badge.wait { background: var(--line); color: var(--sub); }
  .badge.try { background: var(--futon); }
  header.hero h1 { font-size: clamp(40px, 8vw, 84px); line-height: 1.15; margin: 14px 0 6px; text-shadow: 0 4px 24px rgba(5,8,30,.8); }
  .nb { display: inline-block; }
  header.hero .lead { font-size: clamp(17px, 2.4vw, 22px); margin: 0 0 22px; text-shadow: 0 2px 12px rgba(5,8,30,.9); }
  .btns { display: flex; flex-wrap: wrap; gap: 10px; }
  .btn { display: inline-block; text-decoration: none; font-weight: 900; padding: 10px 22px; border-radius: 12px; background: var(--paper); color: var(--ink); box-shadow: 0 4px 0 #0a0d1e; }
  .btn.shu { background: var(--shu); color: var(--paper); }
  .cap { position: absolute; right: 16px; bottom: 10px; z-index: 1; font-size: 11px; color: var(--sub); opacity: .8; }

  section { padding: 72px 0 24px; }
  h2 { font-family: 'Shippori Mincho', serif; font-weight: 800; font-size: clamp(28px, 4.4vw, 40px); margin: 0 0 6px; line-height: 1.3; }
  h2 .no { color: var(--shu); margin-right: 10px; }
  .sec-lead { color: var(--sub); margin: 0 0 28px; }
  h3 { font-size: 20px; margin: 32px 0 10px; font-weight: 900; }

  /* 3つの特長 */
  .three { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
  .card { background: var(--night); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
  .card h4 { margin: 10px 0 4px; font-size: 18px; font-weight: 900; }
  .card p { margin: 0; color: var(--sub); font-size: 15px; }

  /* 写真と文の段 */
  .row2 { display: grid; grid-template-columns: 1.2fr 1fr; gap: 28px; align-items: center; margin: 24px 0; }
  .row2.rev { grid-template-columns: 1fr 1.2fr; }
  .row2.rev > .shot { order: 2; }
  .shot { border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: var(--deep); }
  .shot figcaption { font-size: 12px; color: var(--sub); padding: 6px 10px; }
  @media (max-width: 760px) { .row2, .row2.rev { grid-template-columns: 1fr; } .row2.rev > .shot { order: 0; } }

  /* くり返し再生の短い動画 */
  .clip { position: relative; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: var(--deep); }
  .clip .lbl { position: absolute; left: 10px; bottom: 8px; font-size: 12px; font-weight: 900; color: var(--paper); background: rgba(14,18,38,.72); padding: 1px 10px; border-radius: 99px; }
  .reel { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 28px; }
  @media (max-width: 760px) { .reel { grid-template-columns: 1fr; } }
  .card .ic { display: inline-flex; width: 34px; height: 34px; align-items: center; justify-content: center; border-radius: 8px; background: var(--shu); color: var(--paper); font-family: 'Shippori Mincho', serif; font-weight: 800; font-size: 19px; }

  .avs { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; margin: 0 0 24px; }
  .avs figure { margin: 0; background: var(--night); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; text-align: center; }
  .avs img { width: 100%; aspect-ratio: 5 / 7; object-fit: cover; }
  .avs figcaption { font-weight: 900; font-size: 14px; padding: 4px 2px 6px; }
  .avs small { display: block; font-weight: 500; font-size: 11px; color: var(--sub); }
  @media (max-width: 760px) { .avs { grid-template-columns: repeat(4, 1fr); } }
  @media (max-width: 420px) { .avs { grid-template-columns: repeat(3, 1fr); } }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0; }
  @media (max-width: 560px) { .pair { grid-template-columns: 1fr; } }

  ul.dots { margin: 0; padding-left: 1.2em; }
  ul.dots li { margin: 4px 0; }
  .kbd { display: inline-block; min-width: 1.8em; text-align: center; font-size: 13px; font-weight: 900; background: var(--paper); color: var(--ink); border-radius: 6px; padding: 0 6px; box-shadow: 0 2px 0 #0a0d1e; margin: 0 2px; }

  /* 遊びの一覧 */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 18px; }
  .chip { font: inherit; font-weight: 900; font-size: 14px; border: 1px solid var(--line); background: var(--night); color: var(--sub); padding: 6px 14px; border-radius: 99px; cursor: pointer; }
  .chip.on { background: var(--shu); border-color: var(--shu); color: var(--paper); }
  .games { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .g { background: var(--paper); color: var(--ink); border-radius: 14px; padding: 14px 16px 12px; position: relative; box-shadow: 0 4px 0 #0a0d1e; }
  .g .nm { font-weight: 900; font-size: 17px; }
  .g .ic { margin-right: 6px; }
  .g .ppl { display: inline-block; font-size: 12px; font-weight: 900; color: var(--futon); background: #dfeeed; border-radius: 99px; padding: 0 8px; margin-top: 4px; }
  .g p { margin: 6px 0 0; font-size: 14px; line-height: 1.65; color: #4a4652; }
  .g .st { position: absolute; top: 10px; right: 10px; font-size: 11px; }
  .count { color: var(--andon); font-weight: 900; }

  /* ワールド */
  .worlds { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .w { border-radius: 14px; overflow: hidden; background: var(--night); border: 1px solid var(--line); }
  .w img { aspect-ratio: 16/10; object-fit: cover; width: 100%; }
  .w .t { padding: 8px 12px 10px; }
  .w .t b { font-family: 'Shippori Mincho', serif; font-size: 18px; }
  .w .t .han { display: inline-block; background: var(--shu); color: var(--paper); font-family: 'Shippori Mincho', serif; font-weight: 800; font-size: 13px; width: 22px; height: 22px; line-height: 22px; text-align: center; border-radius: 4px; margin-right: 6px; vertical-align: 2px; }
  .w .t p { margin: 2px 0 0; color: var(--sub); font-size: 13px; line-height: 1.6; }

  /* 表 */
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--andon); font-weight: 900; white-space: nowrap; }
  .tablewrap { overflow-x: auto; background: var(--night); border: 1px solid var(--line); border-radius: 14px; padding: 6px 8px; }

  /* 決まりの紙 */
  .paper { background: var(--paper); color: var(--ink); border-radius: 16px; padding: 24px 26px; box-shadow: 0 6px 0 #0a0d1e; }
  .paper h3 { margin-top: 18px; }
  .paper h3:first-child { margin-top: 0; }
  .paper code { background: var(--paper2); padding: 2px 8px; border-radius: 6px; font-size: 14px; display: inline-block; }
  .note { border-left: 4px solid var(--andon); background: rgba(255,184,102,.08); padding: 10px 14px; border-radius: 0 10px 10px 0; color: var(--paper); font-size: 15px; margin: 16px 0; }
  .draft { border: 2px dashed var(--shu); border-radius: 12px; padding: 8px 14px; color: var(--shu); font-weight: 900; font-size: 14px; margin-bottom: 14px; background: #fff3ee; }

  /* よくある質問 */
  details { background: var(--night); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; margin: 8px 0; }
  summary { cursor: pointer; font-weight: 900; }
  details p { margin: 8px 0 0; color: var(--sub); }

  footer { margin-top: 72px; padding: 32px 0 48px; background: var(--deep); color: var(--sub); font-size: 13px; }
  footer h4 { color: var(--paper); margin: 0 0 6px; font-size: 15px; }
  footer ul { margin: 0 0 16px; padding-left: 1.2em; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  a:focus-visible, button:focus-visible, summary:focus-visible { outline: 3px solid var(--andon); outline-offset: 2px; }
  .clip.flat { border: 0; border-radius: 0; }
  .faces { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
  .small { font-size: 12px; color: var(--sub); margin: 8px 0 0; }
  .enhint { background: var(--andon); color: var(--ink); font-size: 13px; font-weight: 700; }
  .enhint .wrap { display: flex; align-items: center; gap: 8px; padding-block: 6px; }
  .enhint a { color: var(--ink); }
  .enhint button { margin-left: auto; font: inherit; font-size: 16px; line-height: 1; border: 0; background: transparent; color: var(--ink); cursor: pointer; padding: 2px 6px; }
  .langsw { margin-left: auto; display: inline-flex; border: 1px solid var(--line); border-radius: 99px; overflow: hidden; flex: none; }
  .langsw button { font: inherit; font-size: 13px; font-weight: 700; border: 0; background: transparent; color: var(--sub); padding: 4px 12px; cursor: pointer; }
  .langsw button.on { background: var(--paper); color: var(--ink); }
</style>
</head>
<body>
<div class="enhint" id="enhint" lang="en" hidden><div class="wrap">English version is available. <a href="#top">Read in English</a><button type="button" aria-label="Close">×</button></div></div>
<nav class="top"><div class="wrap">
  <a class="logo" href="#top" data-t="logo"></a>
  <div class="navlinks">
  <a class="n" href="#about" data-t="nav.about"></a>
  <a class="n" href="#talk" data-t="nav.talk"></a>
  <a class="n" href="#play" data-t="nav.play"></a>
  <a class="n" href="#go" data-t="nav.go"></a>
  <a class="n" href="#avatar" data-t="nav.avatar"></a>
  <a class="n" href="#asagao" data-t="nav.asagao"></a>
  <a class="n" href="#camera" data-t="nav.camera"></a>
  <a class="n" href="#stream" data-t="nav.stream" data-stream></a>
  <a class="n" href="#device" data-t="nav.device"></a>
  <a class="n" href="#room" data-t="nav.room"></a>
  <a class="n" href="#next" data-t="nav.next"></a>
  <a class="n" href="#faq" data-t="nav.faq"></a>
  </div>
  <span class="langsw" role="group" aria-label="Language"><button type="button" id="lang-ja" data-lang="ja">日本語</button><button type="button" id="lang-en" data-lang="en">English</button></span>
</div></nav>

<header class="hero" id="top">
  <img class="kb" src="/kotaberi/img/v_02_hoshi_e.jpg" alt="" aria-hidden="true">
  <div class="wrap">
    <span class="badge" data-t="badge.invite"></span>
    <h1 class="min" data-t="hero.title"></h1>
    <p class="lead" data-t="hero.lead"></p>
    <div class="btns"><a class="btn shu" href="#play" data-t="hero.btnPlay"></a><a class="btn" id="btn2" href="#stream" data-t="hero.btnStream"></a></div>
  </div>
  <div class="cap" data-t="hero.cap"></div>
</header>

<section id="about"><div class="wrap">
  <h2><span class="no" data-t="no.1"></span><span data-t="about.h"></span></h2>
  <p class="sec-lead" data-t="about.lead"></p>
  <div class="three" data-cards="about.cards"></div>
  <div class="reel">
    <div class="clip"><video src="/kotaberi/video/g_hune.mp4" poster="/kotaberi/video/g_hune.jpg" autoplay muted loop playsinline></video><span class="lbl" data-t="reel.1"></span></div>
    <div class="clip"><video src="/kotaberi/video/g_kotatsu.mp4" poster="/kotaberi/video/g_kotatsu.jpg" autoplay muted loop playsinline></video><span class="lbl" data-t="reel.2"></span></div>
    <div class="clip"><video src="/kotaberi/video/g_sora.mp4" poster="/kotaberi/video/g_sora.jpg" autoplay muted loop playsinline></video><span class="lbl" data-t="reel.3"></span></div>
  </div>
  <p class="small" data-t="reel.note"></p>
  <div class="row2" style="margin-top:36px">
    <figure class="shot" style="margin:0"><div class="clip flat"><video src="/kotaberi/video/chibi5.mp4" poster="/kotaberi/video/chibi5.jpg" autoplay muted loop playsinline data-aria="about.vidAria"></video></div><figcaption data-t="about.vidCap"></figcaption></figure>
    <div>
      <h3 id="join" style="margin-top:0;scroll-margin-top:72px" data-t="about.inviteH"></h3>
      <ul class="dots" data-li="about.invite"></ul>
    </div>
  </div>
</div></section>

<section id="talk"><div class="wrap">
  <h2><span class="no" data-t="no.2"></span><span data-t="talk.h"></span></h2>
  <p class="sec-lead" data-t="talk.lead"></p>
  <div class="row2">
    <figure class="shot" style="margin:0"><div class="clip flat"><video src="/kotaberi/video/kao.mp4" poster="/kotaberi/video/kao.jpg" autoplay muted loop playsinline data-aria="talk.vidAria"></video></div><figcaption data-t="talk.vidCap"></figcaption></figure>
    <div class="tablewrap"><table data-rows="talk.rows"></table></div>
  </div>
  <div class="row2 rev">
    <figure class="shot" style="margin:0"><img src="/kotaberi/img/v_05_odai_to_heya.jpg" data-alt="board.alt" loading="lazy"><figcaption data-t="board.cap"></figcaption></figure>
    <div><h3 style="margin-top:0" data-t="board.h"></h3><div data-t="board.body"></div></div>
  </div>
</div></section>

<section id="play"><div class="wrap">
  <h2><span class="no" data-t="no.3"></span><span data-t="play.h"></span></h2>
  <p class="sec-lead" data-t="play.lead"></p>
  <div class="chips" id="chips"></div>
  <div class="games" id="games"></div>
  <div class="row2 rev" style="margin-top:40px">
    <figure class="shot" style="margin:0"><div class="clip flat"><video src="/kotaberi/video/jenga.mp4" poster="/kotaberi/video/jenga.jpg" autoplay muted loop playsinline data-aria="play.vidAria"></video></div><figcaption data-t="play.vidCap"></figcaption></figure>
    <div data-t="play.body"></div>
  </div>
</div></section>

<section id="go"><div class="wrap">
  <h2><span class="no" data-t="no.4"></span><span data-t="go.h"></span></h2>
  <p class="sec-lead" data-t="go.lead"></p>
  <div class="row2" style="margin-top:0">
    <figure class="shot" style="margin:0"><div class="clip flat"><video src="/kotaberi/video/dekakeru.mp4" poster="/kotaberi/video/dekakeru.jpg" autoplay muted loop playsinline data-aria="go.vidAria"></video></div><figcaption data-t="go.vidCap"></figcaption></figure>
    <div data-t="go.body1"></div>
  </div>
  <div class="worlds" id="worlds"></div>
  <div class="row2" style="margin-top:36px">
    <figure class="shot" style="margin:0"><img src="/kotaberi/img/soujuu.jpg" data-alt="go.helmAlt" loading="lazy"><figcaption data-t="go.helmCap"></figcaption></figure>
    <div data-t="go.body2"></div>
  </div>
</div></section>

<section id="avatar"><div class="wrap">
  <h2><span class="no" data-t="no.5"></span><span data-t="av.h"></span></h2>
  <p class="sec-lead" data-t="av.lead"></p>
  <div class="avs" id="avs"></div>
  <div class="row2 rev">
    <figure class="shot" style="margin:0"><div class="clip flat"><video src="/kotaberi/video/chibi3.mp4" poster="/kotaberi/video/chibi3.jpg" autoplay muted loop playsinline data-aria="av.vidAria"></video></div><figcaption data-t="av.vidCap"></figcaption></figure>
    <div class="tablewrap"><table data-rows="av.rows"></table></div>
  </div>
  <div class="pair">
    <figure class="shot" style="margin:0"><img src="/kotaberi/img/v_chibi_5nin.jpg" data-alt="av.pic1Alt" loading="lazy"><figcaption data-t="av.pic1Cap"></figcaption></figure>
    <figure class="shot" style="margin:0"><img src="/kotaberi/img/v_chibi_neko.jpg" data-alt="av.pic2Alt" loading="lazy"><figcaption data-t="av.pic2Cap"></figcaption></figure>
  </div>
  <div class="note" data-t="av.note"></div>
</div></section>

<section id="asagao"><div class="wrap">
  <h2><span class="no" data-t="no.6"></span><span data-t="asa.h"></span></h2>
  <p class="sec-lead" data-t="asa.lead"></p>
  <div class="three" data-cards="asa.cards"></div>
</div></section>

<section id="camera"><div class="wrap">
  <h2><span class="no" data-t="no.7"></span><span data-t="cam.h"></span></h2>
  <p class="sec-lead" data-t="cam.lead"></p>
  <div class="row2">
    <figure class="shot" style="margin:0"><div class="faces"><img src="/kotaberi/img/v_06_kao_hidari.jpg" data-alt="cam.f1" loading="lazy"><img src="/kotaberi/img/v_06_kao_oku.jpg" data-alt="cam.f2" loading="lazy"><img src="/kotaberi/img/v_06_kao_migi.jpg" data-alt="cam.f3" loading="lazy"></div><figcaption data-t="cam.facesCap"></figcaption></figure>
    <div><ul class="dots" data-li="cam.points"></ul></div>
  </div>
  <div class="tablewrap" style="margin-top:12px"><table data-rows="cam.keys" data-head="cam.keysHead"></table></div>
</div></section>

<section id="stream" data-stream><div class="wrap">
  <h2><span class="no" data-t="no.8"></span><span data-t="st.h"></span></h2>
  <p class="sec-lead" data-t="st.lead"></p>
  <div class="paper">
    <div class="draft" data-t="st.draft"></div>
    <h3 data-t="st.askH"></h3><ol data-li="st.ask"></ol>
    <h3 data-t="st.ngH"></h3><ul data-li="st.ng"></ul>
    <h3 data-t="st.etcH"></h3><ul data-li="st.etc"></ul>
  </div>
</div></section>

<section id="device"><div class="wrap">

  ['🎣', [5], '釣り', 'Fishing', '何人でも', 'Any number', '外のワールドで。当たりが来たら「ひく！」。8か所で79種、図鑑つき。', 'Fish at any destination and hit "Reel!" when you get a bite. 79 kinds across 8 places, with a field guide.'],
  ['🌱', [5], '花壇', 'Flower Bed', '何人でも', 'Any number', 'いつもの部屋の奥の8か所に種をまく。12時間で咲く。花は12種、図鑑つき。', 'Plant seeds in 8 spots at the back of the home room. They bloom in 12 hours. 12 kinds of flowers, with a field guide.'],
];

// ワールド（英語の名前は仮。こたべり本体の英語の表ができたら合わせる）
const WORLDS = [
  ['家', 'いつもの部屋', 'Home Room', 'おかえりなさい。障子と行灯の和室。花壇もここに。', 'Welcome back. A Japanese room with shoji and a paper lantern. The flower bed is here too.', 'v_01_heya_4nin.jpg'],
  ['星', '星の川原', 'Starry Riverbank', '星の川のほとり。天の川と星座、川に映る星。', 'A riverbank under the stars, with the Milky Way, constellations, and stars reflected in the water.', 'v_02_hoshi_b.jpg'],
  ['雲', '雲海の山々', 'Sea of Clouds', '雲の上の夜明け。朝までしゃべった日に。', 'Dawn above the clouds. For nights you talked until morning.', 'w_kumo.jpg'],
  ['朱', '大鳥居の夜', 'Night of the Great Torii', '水の上の大きな鳥居。少しあらたまって話す夜に。', 'A great torii gate standing in the water. For a slightly more serious talk.', 'w_torii.jpg'],
  ['灯', '夜の参道', 'Lantern Path', '灯籠の灯りがつづく道。ゆっくり話したい夜に。', 'A path lit by stone lanterns. For a slow, unhurried talk.', 'w_sando.jpg'],
  ['紅', '紅葉の谷', 'Autumn Valley', '色づいた谷の夕暮れ。のんびり話したい日に。', 'Sunset over a valley of autumn leaves. For a lazy afternoon chat.', 'w_momiji.jpg'],
  ['華', '花火の夜', 'Fireworks Night', '目の前で花火が開く。全員の画面で同じタイミング。', 'Fireworks burst right in front of you, at the same moment on everyone\'s screen.', 'v_03_hanabi_a.jpg'],
  ['雪', '雪見の夜', 'Snowy Night', 'しんしんと雪がふる。こたつがいちばん似合う夜に。', 'Snow falls quietly. The night a kotatsu suits best.', 'w_yuki.jpg'],
  ['桜', '夜桜', 'Night Sakura', '満開の桜の上で。はじめての人と話す日に。', 'Above cherry trees in full bloom. For meeting someone new.', 'w_sakura.jpg'],
];

// 入口で選べるアバター（並びはアプリの入口と同じ。絵は img/av/v0〜v6.webp）
const AVS = [['なす', 'Eggplant', 'chibi'], ['猫又', 'Nekomata', 'chibi'], ['包子の侍', 'Bao Samurai', 'chibi'], ['千駄ヶ谷 渋', 'Sendagaya Shibu', 'human'], ['朝顔', 'Asagao', 'human'], ['すみれ', 'Sumire', 'human'], ['蓮', 'Ren', 'human']];

// ---------- 言語を決める（上が強い）: ?lang= → アドレスが /en/ で始まる → 端末のおぼえ → 日本語 ----------
// 公開先は2つ（同じ index.html）: 日本語 civildot.dev/kotaberi/ 、英語 civildot.dev/en/kotaberi/
// ブラウザが日本語以外で、指定もおぼえも無いときは、自動では移さず「English version is available」の案内だけ出す
const LANGS = ['ja', 'en'], KEY = 'kotaberi_lang';
const ON_SITE = /(^|\.)civildot\.dev$/.test(location.hostname);
let hinted = false;
function pickLang() {
  try { const q = new URLSearchParams(location.search).get('lang'); if (LANGS.includes(q)) { try { localStorage.setItem(KEY, q); } catch {} return q; } } catch {}
  if (/^\/en\//.test(location.pathname)) return 'en';
  try { const s = localStorage.getItem(KEY); if (LANGS.includes(s)) return s; } catch {}
  if (!(navigator.language || '').toLowerCase().startsWith('ja')) hinted = true;
  return 'ja';
}
// その言語のページのアドレス（公開先の上だけ。ほかでは null）
function pageUrl(l) {
  if (!ON_SITE) return null;
  const u = new URL(location.href), p = u.pathname.replace(/^\/en(?=\/)/, '');
  u.pathname = l === 'en' ? '/en' + p : p; u.searchParams.delete('lang'); return u.toString();
}
let lang = pickLang(), cat = 0;
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');

function render() {
  const S = STR[lang], fill = s => String(s).replace('{n}', GAMES.length).replace('{faqPage}', SITE.faqPage);
  document.documentElement.lang = lang;
  document.title = S['meta.title'];
  let md = document.querySelector('meta[name="description"]'); if (md) md.setAttribute('content', S['meta.desc']);
  document.querySelectorAll('[data-t]').forEach(el => { el.innerHTML = fill(S[el.dataset.t] ?? ''); });
  document.querySelectorAll('[data-alt]').forEach(el => { el.alt = S[el.dataset.alt] ?? ''; });
  document.querySelectorAll('[data-aria]').forEach(el => { el.setAttribute('aria-label', S[el.dataset.aria] ?? ''); });
  document.querySelectorAll('[data-li]').forEach(el => { el.innerHTML = (S[el.dataset.li] || []).map(x => `<li>${fill(x)}</li>`).join(''); });
  document.querySelectorAll('[data-rows]').forEach(el => {
    const head = el.dataset.head ? `<tr>${S[el.dataset.head].map(h => `<th>${h}</th>`).join('')}</tr>` : '';
    el.innerHTML = head + (S[el.dataset.rows] || []).map(([a, b]) => `<tr>${el.dataset.head ? `<td>${a}</td>` : `<th>${a}</th>`}<td>${b}</td></tr>`).join('');
  });
  document.querySelectorAll('[data-cards]').forEach(el => {
    el.innerHTML = (S[el.dataset.cards] || []).map(c => `<div class="card">${c.ic ? `<div class="ic">${c.ic}</div>` : ''}${c.badge ? `<span class="badge ${c.badge[0]}">${c.badge[1]}</span>` : ''}<h4>${fill(c.h)}</h4><p>${fill(c.p)}</p></div>`).join('');
  });
  // よくある質問（配信の答えは、配信の節を出さないときは3つめの文）
  document.getElementById('faqlist').innerHTML = S['faq.list'].map(([q, a, aOff]) => `<details><summary>${q}</summary><p>${!SITE.stream && aOff ? aOff : a}</p></details>`).join('');
  // 遊び
  const chips = document.getElementById('chips');
  chips.innerHTML = S.cats.map((c, i) => `<button type="button" class="chip${i === cat ? ' on' : ''}" data-c="${i}">${c}</button>`).join('');
  chips.querySelectorAll('.chip').forEach(b => b.onclick = () => { cat = +b.dataset.c; render(); });
  const L = lang === 'ja' ? 0 : 1;
  document.getElementById('games').innerHTML = GAMES.filter(g => cat === 0 || g[1].includes(cat)).map(g => `<div class="g"><div class="nm"><span class="ic">${g[0]}</span>${esc(g[2 + L])}</div><span class="ppl">${esc(g[4 + L])}</span><p>${esc(g[6 + L])}</p></div>`).join('');
  // ワールド
  document.getElementById('worlds').innerHTML = WORLDS.map(w => `<div class="w"><img src="/kotaberi/img/${w[5]}" alt="${esc(w[1 + L])}" loading="lazy"><div class="t"><span class="han">${w[0]}</span><b>${esc(w[1 + L])}</b><p>${esc(w[3 + L])}</p></div></div>`).join('');
  // アバター
  document.getElementById('avs').innerHTML = AVS.map((a, i) => `<figure><img src="/kotaberi/img/av/v${i}.webp" alt="${esc(a[L])}" loading="lazy"><figcaption>${esc(a[L])}<small>${S['av.kind.' + a[2]]}</small></figcaption></figure>`).join('');
  // 配信の節を出さないとき: 節と目次をかくし、上の2つめのボタンを作品の紹介へ
  document.querySelectorAll('[data-stream]').forEach(el => { el.hidden = !SITE.stream; });
  const b2 = document.getElementById('btn2');
  if (!SITE.stream) { b2.href = SITE.works; b2.textContent = S['hero.btnWorks']; }
  // サイトをまたぐリンクに、いまの言語を付ける
  document.querySelectorAll('a[href^="https://"]').forEach(a => { try { const u = new URL(a.href); if (/(^|\.)civildot\.dev$/.test(u.hostname)) { u.searchParams.set('lang', lang); a.href = u.toString(); } } catch {} });
  // 切りかえのボタンと、英語版の案内
  document.querySelectorAll('[data-lang]').forEach(b => { b.classList.toggle('on', b.dataset.lang === lang); b.setAttribute('aria-pressed', b.dataset.lang === lang); });
  const hint = document.getElementById('enhint');
  hint.hidden = !(hinted && lang === 'ja');
  hint.querySelector('a').href = pageUrl('en') || '#top';
}
// 押したら: 公開先では、もう一方のアドレスへ移る。ほかでは、その場で切りかえる。どちらも端末におぼえる
function setLang(l) {
  try { localStorage.setItem(KEY, l); } catch {}
  const url = pageUrl(l);
  if (url) { location.href = url; return; }
  lang = l; hinted = false; render();
}
document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
document.getElementById('enhint').querySelector('a').addEventListener('click', e => { e.preventDefault(); setLang('en'); });
document.getElementById('enhint').querySelector('button').addEventListener('click', () => { hinted = false; render(); });
render();

// 動きを減らす設定の人には、動画を止めて最初のコマだけ見せる
if (matchMedia('(prefers-reduced-motion: reduce)').matches) document.querySelectorAll('video').forEach(v => { v.removeAttribute('autoplay'); v.pause(); });
</script>
</body>
